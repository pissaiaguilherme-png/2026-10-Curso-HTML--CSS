<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Caracteres-->
    <meta charset="UTF-8">
    <!-- ocupação da tela-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso HTML - Guilherme </title>

    <!--Search Engine Optmization-->
    <meta name="description" content="Curso de HTML, CSS e JS em Castro-PR, elaborado pelo SENAC">
    <!--Palavras Chave-->
    <meta name="keywords" content="HTML, CSS, JSS, webdesign, programação web, html 5">
    <!--Permitir Robôs-->
    <meta name="robots" content="index, follow">

    <!--Carregamento de tudo que seja necessário antes de mostrar a página-->
    <link rel="stylesheet" href="styles.css">

</head>
    <!-- É o que vai aparecer na tela do usuário -->
<body>
    <!-- Cabeçalho: Logo, Menus Botões do Celular -->
    <!-- Div = Container - serve pra guardar algo -->
        <div id="header"></div>
    <!-- Main - Conteúdo Principal -->
    <main>
        <!-- Hero: Título - Texto - Botão - Imagem -->
         <div id="Hero"></div>
        <!-- Benefícios (vantagens): Título - Textos - Cards -->
         <div id="benefícios"></div>
        <!-- Sobre: Explicar a Empresa, Produto ou Serviço -->
         <div id="sobre"></div>
        <!-- Call to Action - CTA ou chamado para ação: Comece agora, curte, compartilhe, inscrevase, saiba mais, etc -->
         <div id="cta"></div>
        <!-- Contato: Formulário, Endereço, Telefone, etc -->
         <div id="contato"></div>
    </main>
    <!-- Rodapé: Informações, Links, Mapas, Redes Sociais -->
    <footer>
        <p>Desenvolvido por: Guilherme</p>
    </footer>
    <!-- Scripts: Código Javascript -->
    <script src="scripts.js"></script>
</body> 

</html>
