<!-- Criando Seção -->
<section class="hero">

        <!-- Criar area do texto -->
        <div class="hero-texto">

            <!-- Texto em destaque ou texto em linha -->
            <span class="hero-destaque">Desenvolvimento Web</span>
            <!-- Títulos e subtítulos h1, h2, h3 -->
            <h1>Aprenda HTML, CSS e JS</h1>
            <!-- Parágrafo -->
            <p>Aprenda os fundamentos de HTML, CSS e JavaScript e tenha suas primeiras noções de desenvolvimento web.
            </p>
            <!-- Pular a linha br -->
            <!-- Anchor - link: Chamado para a ação -->
            <a href="#beneficios" class="botao-hero">Saiba mais</a>
        </div>
        <!-- Área de imagem -->
        <div class="hero-imagem">
            <!-- src = local do arquivo e alt descrição ou título da imagem -->
            <!-- Pessoa: CPF, RG, Etc -->
            <!-- Veículos: Placa, Renavam, Etc -->
            <!-- Upload: Nome Do Aquivo, URL -->
            <!-- Upload -->
            <!-- src="{{pessoa.upload.url}}" -->
            <img src="https://placehold.co/600x400" alt="Ilustração de desenvolvimento web" fetchpriority="high">
        </div>
    </div>
